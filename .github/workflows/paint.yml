name: paint

on:
  schedule:
    - cron: "41 12 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paint
  cancel-in-progress: false

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2000

      - run: cc -o "$RUNNER_TEMP/p" paint.s

      - env:
          PAINT_EMAIL: ${{ vars.USER_EMAIL }}
        run: '"$RUNNER_TEMP/p" extend'

      - env:
          BRANCH: ${{ github.ref_name }}
        run: git push origin "HEAD:$BRANCH"

      - run: '"$RUNNER_TEMP/p" verify 7'
